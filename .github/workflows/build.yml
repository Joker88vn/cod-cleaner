name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk /tmp/COD-Cleaner.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: COD Cleaner – bản ${{ github.run_number }}
          make_latest: true
          files: /tmp/COD-Cleaner.apk
      - name: Publish APK to apk branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan apk
          git rm -rf --quiet .
          cp /tmp/COD-Cleaner.apk .
          git add COD-Cleaner.apk
          git commit -m "APK build ${{ github.run_number }}"
          git push -f origin apk
